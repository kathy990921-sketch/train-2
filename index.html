<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>火車收集家</title>
<style>
:root{--sky:#29a8ff;--blue:#1b3fa0;--yellow:#ffc928;--red:#ee3b3b;--cream:#fff4cf;--ink:#16224d;--green:#3cb44b}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:flex;flex-direction:column;background:var(--sky);color:var(--ink);overflow:hidden;
 font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-weight:700;
 padding-top:env(safe-area-inset-top)}
#wrap{flex:1;min-height:0;container-type:size;display:grid;place-items:center}
#stage{position:relative;width:min(100cqw,calc(100cqh*1058/1487));aspect-ratio:1058/1487;background:#000;overflow:hidden}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#msg{position:absolute;left:18%;right:18%;top:30%;text-align:center;background:var(--cream);border-radius:18px;padding:14px;line-height:1.5}
#bar{height:calc(96px + env(safe-area-inset-bottom));padding:8px 16px env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:space-between;background:var(--blue)}
.side{width:64px;height:64px;border:0;border-radius:20px;background:var(--cream);color:var(--blue);font:inherit;font-size:13px;display:grid;place-items:center;cursor:pointer}
.side b{font-size:24px;line-height:1}
#shutter{width:80px;height:80px;border-radius:50%;border:0;cursor:pointer;padding:8px;
 background:repeating-conic-gradient(var(--yellow) 0 15deg,#222 15deg 30deg)}
#shutter i{display:block;width:100%;height:100%;border-radius:50%;background:var(--red);border:4px solid #fff;transition:transform .1s}
#shutter:active i{transform:scale(.88)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.sheet{position:fixed;inset:auto 0 0 0;max-height:78dvh;overflow:auto;background:var(--cream);border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
 box-shadow:0 -6px 24px #0005;transform:translateY(110%);transition:transform .25s}
.sheet.on{transform:none}
.row{display:flex;gap:14px;align-items:flex-start}
.row img{width:84px;border-radius:12px;border:3px solid #fff}
h2{font-size:22px;line-height:1.3;color:var(--blue)}
.tag{display:inline-block;background:var(--blue);color:#fff;border-radius:99px;padding:2px 10px;font-size:13px;margin:4px 4px 4px 0}
.new{background:var(--red)}
.meter{height:12px;border-radius:9px;background:#0002;margin:10px 0 4px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--green)}
ul{padding-left:20px;margin:8px 0;font-weight:600;line-height:1.6}
.adv{background:#fff;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:600}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button{flex:1;min-height:48px;border:0;border-radius:16px;font:inherit;font-size:16px;cursor:pointer;background:var(--blue);color:#fff}
.btns .alt{background:var(--yellow);color:var(--ink)}
.spin{width:36px;height:36px;border:5px solid #0002;border-top-color:var(--blue);border-radius:50%;animation:r 1s linear infinite;flex:none}
@keyframes r{to{transform:rotate(360deg)}}
#book{position:fixed;inset:0;background:var(--sky);overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 90px;display:none}
#book.on{display:block}
#book header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:22px;color:#fff}
#book header button{border:0;border-radius:14px;padding:10px 16px;font:inherit;background:var(--yellow);color:var(--ink);cursor:pointer}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:var(--cream);border-radius:18px;padding:8px;text-align:center;font-size:14px}
.card .ph{aspect-ratio:4/3;border-radius:12px;background:#0003;display:grid;place-items:center;font-size:34px;color:#fff;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover}
.card.no{opacity:.75}.card small{display:block;font-weight:600;color:#555}
@media (prefers-reduced-motion:reduce){.sheet,#shutter i{transition:none}.spin{animation-duration:3s}}
</style>
</head>

const CONFIG = { API_KEY: '', MODEL: 'claude-sonnet-5-5' };   // API_KEY 留空 → 第一次辨識時會詢問並存在這支手機
const DB = {"decision_order": ["先確認畫面中是否有火車或軌道車輛，否則 not_train", "全黑鍋爐、煙囪、外露連桿 → STEAM", "鴨嘴長車鼻、白色寬車身配橘黑線條 → HSR700T", "白底綠線、車身短(約2~6節)、無臺鐵車種特徵 → METRO（注意：臺中捷運有集電弓，不能只靠有無集電弓判斷）", "列車兩端各有一節機車頭 → PP_E1000；只有單端機車頭牽引的橘色客車 → CHUKUANG", "電聯車看車頭形狀與塗裝；柴聯車看車頂無集電弓且有散熱排氣設備（銀色加黃色車頭）", "節數只是輔助證據，拍不到整列車時不可當作判斷依據"], "classes": [{"id": "EMU3000", "name": "新自強號 EMU3000", "group": "對號列車", "features": ["極簡黑白配色", "流線子彈型車頭，比高鐵扁平", "車側黑白色帶，點綴紅/藍/綠或特仕彩繪", "12節固定編組，第6節為騰雲座艙", "電聯車，有集電弓，無傾斜功能"], "vs": "比高鐵小、無橘黑線條；沒有橘或紅色大面積塗裝"}, {"id": "TEMU1000", "name": "太魯閣號 TEMU1000", "group": "對號列車", "features": ["車頭較圓潤", "白色車身搭配橘黃色與灰黑色線條", "傾斜式列車，8節"], "vs": "車頭圓潤+橘黃線條；普悠瑪則方正+亮紅"}, {"id": "TEMU2000", "name": "普悠瑪號 TEMU2000", "group": "對號列車", "features": ["車頭較方正有稜角", "白色車身搭配亮紅色塗裝", "車頭與車側有大型紅色 TRA 字樣", "傾斜式列車，8節"], "vs": "車頭方正+亮紅+TRA大字"}, {"id": "PP_E1000", "name": "推拉式自強號 (E1000)", "group": "對號列車", "features": ["橘/黃/咖啡色傳統塗裝", "最前端與最後端各有一節不載客的電力機車頭", "中間夾客車廂"], "vs": "兩端都有機車頭 → PP；只有一端 → 莒光號"}, {"id": "DR3100", "name": "柴聯自強號 (DR3100)", "group": "對號列車", "features": ["不鏽鋼銀色車身", "車頭有黃色警戒色", "車頂有散熱排氣設備，沒有集電弓"], "vs": "銀色+黃色車頭+車頂無集電弓；不要歸類為捷運"}, {"id": "CHUKUANG", "name": "莒光號", "group": "對號列車", "features": ["傳統全橘色車身搭配白色線條", "通常只有一節機車頭牽引", "手動摺疊門或半自動門"], "vs": "只有單端機車頭牽引的橘色客車"}, {"id": "EMU900", "name": "EMU900 型（最美區間車）", "group": "非對號列車", "features": ["銀色不鏽鋼車身", "車頭大面積黑色玻璃", "綠色微笑曲線燈條", "10節編組，單側3扇車門"], "vs": "黑色玻璃車頭+綠色微笑燈條"}, {"id": "EMU800", "name": "EMU800 型（微笑號）", "group": "非對號列車", "features": ["銀色車身", "車頭有黃色與藍色微笑弧線塗裝", "8節編組"], "vs": "黃藍微笑弧線"}, {"id": "EMU700", "name": "EMU700 型（阿福號）", "group": "非對號列車", "features": ["車頭造型突出，像卡通人物臉", "藍、橘色系塗裝", "8節編組"], "vs": "突出車頭+藍橘配色"}, {"id": "EMU500_600", "name": "EMU500 / EMU600 型", "group": "非對號列車", "features": ["傳統通勤電聯車", "銀色車身搭配深藍色與白色線條", "車頭較平"], "vs": "車頭平+深藍白線條，沒有微笑弧線"}, {"id": "HSR700T", "name": "臺灣高鐵 700T", "group": "其他", "features": ["白色寬車身配橘黑線條", "鴨嘴般的長車鼻", "高架軌道"], "vs": "比 EMU3000 大、車鼻特別長"}, {"id": "STEAM", "name": "蒸汽火車", "group": "其他", "features": ["全黑圓筒鍋爐", "煙囪與蒸汽", "外露動輪與連桿"], "vs": ""}, {"id": "METRO", "name": "捷運（如臺中捷運綠線）", "group": "其他", "features": ["白底綠色線條", "車身短", "高架或專用軌道"], "vs": "臺中捷運有集電弓，不可僅憑此排除"}]};
const SYSTEM = `你是臺灣鐵道車輛辨識助理，服務對象是國小到高中的學生。
你會收到一張學生拍的火車照片，請依照資料庫判斷車種。
規則：
1. 先確認畫面中是否有火車或軌道車輛；沒有就回傳 is_train=false、class_id="not_train"。
2. 只依據畫面中實際看得到的特徵判斷；車頭被遮住、太遠或太模糊時降低 confidence。
3. 依 decision_order 的順序檢查。節數只當輔助證據。
4. 兩種車型都有可能時，在 second_guess 填入第二候選的 class_id。
5. confidence 低於 0.6 時，在 advice 提醒學生從正面或斜前方重拍。
6. 只輸出 JSON，不要有其他文字：
{"is_train":true,"class_id":"","name":"","confidence":0.0,"evidence":[],"second_guess":null,"advice":""}
7. name 與 evidence 使用繁體中文，evidence 最多 3 點，語氣適合學生閱讀。
【資料庫】
${JSON.stringify(DB)}`;

async function callAI(b64){
  let key = (CONFIG.API_KEY || localStorage.getItem('tc_key') || '').replace(/\s+/g, '');
  if(!key){ key = (prompt('請輸入 Anthropic API Key（sk-ant- 開頭，只會存在這台裝置）') || '').replace(/\s+/g, ''); if(!key) throw new Error('no key'); localStorage.setItem('tc_key', key); }
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'content-type':'application/json', 'x-api-key': key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify({ model: CONFIG.MODEL, max_tokens: 600, system: SYSTEM, messages: [{ role:'user', content: [
      { type:'image', source:{ type:'base64', media_type:'image/jpeg', data: b64.replace(/^data:image\/jpeg;base64,/, '') } },
      { type:'text', text:'請辨識這張照片中的火車車種。' } ] }] })
  });
  if(!r.ok){
    let m = ''; try{ m = (await r.json()).error?.message || ''; }catch{}
    if(r.status === 401) localStorage.removeItem('tc_key');
    throw new Error(r.status + ' ' + m);
  }
  const data = await r.json();
  const out = JSON.parse((data.content || []).map(c => c.text || '').join('').replace(/```json|```/g, '').trim());
  if(!DB.classes.some(c => c.id === out.class_id)){ out.class_id = 'not_train'; out.is_train = false; }
  return out;
}

/* ---------- 小工具 ---------- */
function h(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function canvas(w, h2){ const c = document.createElement('canvas'); c.width = Math.round(w); c.height = Math.round(h2); return c; }
const load = () => { try { return JSON.parse(localStorage.getItem('tc_book')) || {}; } catch { return {}; } };
const save = b => { try { localStorage.setItem('tc_book', JSON.stringify(b)); } catch {} };
const stamp = () => { const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; };

/* ---------- 讀取邊框，自動找出中間透明窗口的外接矩形 ---------- */
async function initFrame(){
  await frameImg.decode();
  const w = frameImg.naturalWidth, hh = frameImg.naturalHeight;
  const c = canvas(w, hh), x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(frameImg, 0, 0);
  const d = x.getImageData(0, 0, w, hh).data;
  let x0 = w, y0 = hh, x1 = 0, y1 = 0;
  for(let y = 0; y < hh; y += 2) for(let xx = 0; xx < w; xx += 2)
    if(d[(y*w + xx)*4 + 3] < 40){ if(xx < x0) x0 = xx; if(xx > x1) x1 = xx; if(y < y0) y0 = y; if(y > y1) y1 = y; }
  const m = 12; // 往內縮一點，避免裁到邊框
  win = { x: x0+m, y: y0+m, w: x1-x0-2*m, h: y1-y0-2*m };
}

/* ---------- 相機 ---------- */
async function startCam(){
  const msg = $('msg');
  if(!navigator.mediaDevices?.getUserMedia){ msg.textContent = '這個瀏覽器無法開啟相機，請改用 HTTPS 網址或較新的瀏覽器。'; return; }
  try{
    stream?.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ audio:false,
      video:{ facingMode:{ ideal:facing }, width:{ ideal:1920 }, height:{ ideal:1080 } } });
    video.srcObject = stream; await video.play(); msg.hidden = true;
  }catch(e){
    msg.hidden = false;
    msg.textContent = e.name === 'NotAllowedError' ? '需要允許使用相機，請到瀏覽器設定開啟權限後重新整理。' : '開啟相機失敗：' + e.message;
  }
}
$('flip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCam(); };

/* ---------- 拍照：產生「存檔圖」與「辨識圖」 ---------- */
async function shoot(){
  const fw = frameImg.naturalWidth, fh = frameImg.naturalHeight, vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(fw/vw, fh/vh), dw = vw*s, dh = vh*s;      // cover：置中裁切、不變形
  const base = canvas(fw, fh); base.getContext('2d').drawImage(video, (fw-dw)/2, (fh-dh)/2, dw, dh);
  const full = canvas(fw, fh), fx = full.getContext('2d');
  fx.drawImage(base, 0, 0); fx.drawImage(frameImg, 0, 0);        // 完整畫面 = 相機畫面 + 邊框
  const k = Math.min(1, 1024/Math.max(win.w, win.h));            // 辨識圖：只含窗口、不含邊框
  const rec = canvas(win.w*k, win.h*k);
  rec.getContext('2d').drawImage(base, win.x, win.y, win.w, win.h, 0, 0, rec.width, rec.height);
  const th = canvas(200, 200*win.h/win.w); th.getContext('2d').drawImage(rec, 0, 0, th.width, th.height);
  const blob = await new Promise(r => full.toBlob(r, 'image/png'));
  return { blob, url: URL.createObjectURL(blob), recog: rec.toDataURL('image/jpeg', .85), thumb: th.toDataURL('image/jpeg', .7), name: `train_${stamp()}.png` };
}

$('shutter').onclick = async () => {
  if(!stream || !video.videoWidth) return;
  if(last?.url) URL.revokeObjectURL(last.url);
  last = await shoot();
  identify();
};

/* ---------- 呼叫後端辨識並顯示結果 ---------- */
async function identify(){
  sheet.replaceChildren();
  const r = h('div', 'row'); r.append(h('div', 'spin'), h('h2', '', 'AI 正在看這是什麼火車…'));
  sheet.append(r); sheet.classList.add('on');
  try{
    show(await callAI(last.recog));
  }catch(e){
    const m = String(e.message || e);
    const why = m.startsWith('401') ? 'API Key 不正確或已失效，請按「重新輸入 Key」。'
      : m.startsWith('404') || /model/i.test(m) ? '模型名稱不正確，請修改檔案開頭 CONFIG.MODEL（例如 claude-sonnet-4-6）。'
      : m.startsWith('400') && /credit|balance/i.test(m) ? '帳戶額度不足，請到 Anthropic Console 儲值。'
      : m.startsWith('429') ? '呼叫太頻繁或超過額度，請稍後再試。'
      : /Failed to fetch|Load failed|NetworkError/i.test(m) ? '連不上 AI 服務，請檢查網路，或確認網頁是用 https 開啟。'
      : m === 'no key' ? '尚未輸入 API Key。' : '發生未預期的錯誤。';
    const fail = h('h2', '', '辨識失敗了'), detail = h('p', 'adv', why), raw = h('small', '', '詳細：' + m.slice(0, 160));
    sheet.replaceChildren(fail, detail, raw, buttons(['重試', identify], ['重新輸入 Key', () => { localStorage.removeItem('tc_key'); identify(); }, 'alt'], ['儲存照片', saveFile, 'alt']));
  }
}

function buttons(...list){
  const b = h('div', 'btns');
  list.forEach(([t, fn, cls]) => { const x = h('button', cls || '', t); x.onclick = fn; b.append(x); });
  return b;
}

function show(r){
  const cls = classes.find(c => c.id === r.class_id), conf = Math.max(0, Math.min(1, +r.confidence || 0));
  const top = h('div', 'row'), img = h('img'); img.src = last.url; img.alt = '剛拍的照片';
  const info = h('div'); top.append(img, info);
  if(!r.is_train || !cls){
    info.append(h('h2', '', '這張好像不是火車'));
    sheet.replaceChildren(top, h('p', 'adv', r.advice || '請對準火車，讓車頭出現在畫面中間再拍一次。'), buttons(['儲存照片', saveFile, 'alt'], ['再拍一次', closeSheet]));
    return;
  }
  info.append(h('h2', '', cls.name), h('span', 'tag', cls.group));
  let fresh = false;
  if(conf >= .6){
    const book = load(); fresh = !book[cls.id];
    if(fresh){ book[cls.id] = { date: new Date().toLocaleDateString('zh-TW'), thumb: last.thumb }; save(book); }
    if(fresh) info.append(h('span', 'tag new', '新收集！'));
  }
  const meter = h('div', 'meter'), bar = h('span'); bar.style.width = Math.round(conf*100) + '%'; meter.append(bar);
  const items = h('ul'); (r.evidence || []).slice(0, 3).forEach(t => items.append(h('li', '', String(t))));
  sheet.replaceChildren(top, h('div', '', '把握度 ' + Math.round(conf*100) + '%'), meter, items);
  if(conf < .6) sheet.append(h('p', 'adv', r.advice || '把握度偏低，試著從正面或斜前方再拍一次。'));
  else if(!fresh) sheet.append(h('p', 'adv', '這款已經收集過囉！'));
  const second = classes.find(c => c.id === r.second_guess);
  if(second) sheet.append(h('p', '', '也有可能是：' + second.name));
  sheet.append(buttons(['儲存照片', saveFile], ['分享', share, 'alt'], ['繼續拍', closeSheet, 'alt']));
}
function closeSheet(){ sheet.classList.remove('on'); }

/* ---------- 儲存與分享（存的是含邊框的完整畫面） ---------- */
function saveFile(){ const a = h('a'); a.href = last.url; a.download = last.name; document.body.append(a); a.click(); a.remove(); }
async function share(){
  const f = new File([last.blob], last.name, { type:'image/png' });
  if(navigator.canShare?.({ files:[f] })){ try{ await navigator.share({ files:[f], title:'火車收集家' }); return; }catch(e){ if(e.name === 'AbortError') return; } }
  saveFile();
}

/* ---------- 圖鑑 ---------- */
function renderBook(){
  const book = load(), grid = $('grid'); grid.replaceChildren();
  let n = 0;
  classes.forEach(c => {
    const got = book[c.id], card = h('div', 'card' + (got ? '' : ' no')), ph = h('div', 'ph');
    if(got){ n++; const i = h('img'); i.src = got.thumb; i.alt = c.name; ph.append(i); } else ph.textContent = '?';
    card.append(ph, h('div', '', got ? c.name : '尚未收集'));
    if(got) card.append(h('small', '', got.date));
    grid.append(card);
  });
  $('count').textContent = `圖鑑 ${n} / ${classes.length}`;
}
$('open').onclick = () => { renderBook(); $('book').classList.add('on'); };
$('close').onclick = () => $('book').classList.remove('on');

/* ---------- 啟動 ---------- */
(async () => {
  await initFrame();
  classes = DB.classes.map(({ id, name, group }) => ({ id, name, group }));
  startCam();
})();
</script>
</body>
